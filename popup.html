<!DOCTYPE html>
<html>
<head>
    <title>Ghost Tab Clipboard</title>
    <link rel="stylesheet" href="clipboard.css">
    <style>
        /* Additional popup-specific styles */
        body 
        {
            padding: 0;
            margin: 0;
            min-width: 350px;
        }
        
        .popup-container 
        {
            width: auto;
            margin: 0;
            border-radius: 0;
            box-shadow: none;
            max-height: 450px;
            overflow-y: auto;
        }
        
        h1 
        {
            font-size: 16px;
            padding: 8px 0;
            margin-bottom: 8px;
        }
        
        .header-actions 
        {
            margin-bottom: 10px;
        }
        
        #filter-input 
        {
            padding: 6px 8px;
            font-size: 12px;
        }
        
        button 
        {
            padding: 6px 8px;
            font-size: 12px;
        }
        
        .clipboard-item 
        {
            padding: 8px 10px;
        }
        
        .item-text 
        {
            font-size: 12px;
        }
        
        .item-timestamp 
        {
            font-size: 10px;
        }
        
        .empty-message 
        {
            padding: 20px;
            font-size: 12px;
        }
        
        /* Updated button styles */
        #refresh-history 
        {
            background-color: #f0f0f0;
            color: #333;
            border-color: #ddd;
        }
        
        #refresh-history:hover 
        {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container popup-container">
        <h1>Recent Clipboard Items</h1>
        
        <div class="header-actions">
            <div class="search-bar">
                <input type="text" id="filter-input" placeholder="Search...">
            </div>
            <div class="action-buttons">
                <button id="refresh-history" title="Refresh clipboard history">Refresh</button>
                <button id="clear-history">Clear</button>
            </div>
        </div>
        
        <div id="clipboard-history">
            <!-- Clipboard items will be added here dynamically -->
            <div class="empty-message">Loading clipboard history...</div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script src="clipboard.js"></script>
</body>
</html>
